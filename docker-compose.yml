version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: disasterguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: disasterguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disasterguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disasterguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/disasterguard
      ALLOW_SQLITE_FALLBACK: "False"
      SECRET_KEY: disasterguard_production_secret_key_demo_change_me_2026
      WEATHER_PROVIDER: real
      MODEL_MODE: production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disasterguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
