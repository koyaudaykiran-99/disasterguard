services:
  - type: web
    name: ai-disasterguard-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: disasterguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MODEL_MODE
        value: production
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app"]'

databases:
  - name: disasterguard-db
    databaseName: disasterguard
    user: disasterguard_user
    plan: free
    ipAllowList: []
